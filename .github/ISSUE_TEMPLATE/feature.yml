name: Feature request
description: Describe a filing workflow Ablage could handle better.
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: A concrete example helps. What do you do manually today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Ablage help?
      description: Include any simpler approach you have considered.
